# B0 smoke run: laptop CPU, open MIMIC-IV demo in PostgreSQL (mimiciv_demo). Minutes.
# Never use these numbers in results: smoke configs only prove the code runs.
run_name: tabular_smoke
source: postgres
feature_sets: [fate_static]          # B0 arm; diagnoses never enter FaTE runs
require_frozen_threshold: false   # computes the train-split Q3 on the demo
seed: 666
xgb_n_estimators: 50
n_jobs: 1
cache: true
strict_sofa: true
shap_top_k: 10
