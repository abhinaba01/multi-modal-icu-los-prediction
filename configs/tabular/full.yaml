# B0 full run: lab machine, full MIMIC-IV v3.1 in PostgreSQL.
# fate_static is the B0 arm of the comparison grid. The internship feature sets
# (with the post-t0 diagnoses) are reproduced only by the legacy scripts.
run_name: tabular_full
source: postgres
feature_sets: [fate_static]
require_frozen_threshold: true    # run fate_icu.tabular.freeze_threshold first
seed: 666
xgb_n_estimators: null            # contract b0.xgb_n_estimators (3000)
n_jobs: -1
cache: true
strict_sofa: true
shap_top_k: 15
