# Run once with split: val and once with split: test (the runbook, Stage 4.2).
run_name: attribution_first_pass_trial
models_config: configs/models/first_pass.yaml
checkpoint_run: models_first_pass_20261120T180632Z
arm: B3
seed: 666
split: test
n_stays: 50
n_tau_stays: 100
ts_method: extremal_mask   # the user's choice (D-048); static uses IG
